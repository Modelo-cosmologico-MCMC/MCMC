[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcmc-model"
version = "0.2.0"
description = "Modelo Cosmológico de Múltiples Colapsos (MCMC) — implementación de referencia"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Adrián Martínez Estellés" },
]
keywords = ["cosmology", "MCMC", "particle-physics", "WKB", "lattice"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "astropy>=5.3",
    "emcee>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
quantum = ["qutip>=4.7"]
cosmology = ["camb>=1.5", "classy>=3.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff==0.15.8"]
all = ["qutip>=4.7", "camb>=1.5", "pytest>=7.4"]

[tool.setuptools]
packages = [
    "mcmc_ontology",
    "core",
    "mass_program",
    "cosmology",
    "cronos",
    "dynamics",
    "lattice",
    "quantum",
    "visualization",
    "validation",
]

[tool.ruff.lint]
# CONTRATO DE LINT EXPLÍCITO: las reglas activas se declaran aquí para
# que el resultado no dependa del conjunto por defecto de cada versión
# de ruff (la deriva CI-vs-local que rompió el lint en ago-2026). El CI
# fija además la versión de ruff (ver .github/workflows/ci.yml).
# I = orden de imports; ISC = concatenación implícita (incluye ISC004 en
# ruff modernos); C4 = colecciones; RUF007/PLR0124 = pares sucesivos y
# comparación consigo mismo.
extend-select = ["I", "ISC", "C4", "RUF007", "PLR0124"]
# E701/E702 (varias sentencias por línea) se ignoran: el estilo compacto
# es deliberado en varios módulos y no afecta a la corrección.
ignore = ["E701", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
