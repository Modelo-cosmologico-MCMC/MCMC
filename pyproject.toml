[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcmc-model"
version = "0.1.0"
description = "Modelo Cosmológico de Múltiples Colapsos (MCMC) — implementación de referencia"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Adrián Martínez Estellés" },
]
keywords = ["cosmology", "MCMC", "particle-physics", "WKB", "lattice"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "astropy>=5.3",
    "emcee>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
quantum = ["qutip>=4.7"]
cosmology = ["camb>=1.5", "classy>=3.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.1"]
all = ["qutip>=4.7", "camb>=1.5", "pytest>=7.4"]

[tool.setuptools]
packages = [
    "mcmc_ontology",
    "core",
    "mass_program",
    "cosmology",
    "cronos",
    "lattice",
    "quantum",
    "visualization",
    "validation",
]

[tool.ruff.lint]
# E701/E702 (varias sentencias por línea) se ignoran: el estilo compacto
# es deliberado en varios módulos y no afecta a la corrección.
ignore = ["E701", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
