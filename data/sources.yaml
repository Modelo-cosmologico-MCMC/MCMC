# Registro ÚNICO de fuentes observacionales del programa MCMC.
#
# CONTRATO (rama infra/observational-data-registry, 18-ago-2026):
# - Todo fichero observacional entra al repositorio con fuente,
#   versión, SHA256 y transformación trazable ANTES de tocar un
#   likelihood. Los SHA256 nunca se escriben a mano: los computa
#   scripts/data_registry.py al ingerir y quedan en
#   data/manifests/<dataset>.json.
# - POLÍTICA DE TAMAÑO: raw ≤ 10 MB se commitea (el repositorio debe
#   poder ejecutar las fórmulas desde un clone limpio); mayores se
#   obtienen por script con checksum fijado en el manifest.
# - ESTADOS por dataset (en el manifest): AVAILABLE |
#   DATA_UNAVAILABLE | INVALID_CHECKSUM | SCHEMA_UNVERIFIED.
#   SCHEMA_UNVERIFIED significa: bytes presentes y verificados, pero
#   el schema_report humano-legible aún no confirmó columnas/unidades
#   — ningún likelihood puede consumirlo en ese estado.
# - Los directorios legacy (data/pantheon, data/boss_eboss,
#   data/planck2018) permanecen hasta migrar sus consumidores; sus
#   checksums viven en scripts/download_data.py (fijados 31-jul-2026).

datasets:
  sparc:
    role: galaxy_cross_falsification
    host: astroweb.cwru.edu
    raw_dir: data/raw/sparc
    artifacts:
      - SPARC_Lelli2016c.mrt
      - MassModels_Lelli2016c.mrt
      - Rotmod_LTG.zip
      - RAR.mrt
      - RARbins.mrt
    citation: "Lelli, McGaugh & Schombert 2016 (AJ 152, 157)"
    checksum: pending
    state: DATA_UNAVAILABLE   # host denegado por el proxy (18-ago-2026)

  walker2009:
    role: dsph_kinematics
    host: cdsarc.cds.unistra.fr
    catalog: J/AJ/137/3100
    raw_dir: data/raw/walker2009
    artifacts:
      - table2.dat   # Carina  (2400 registros según el ReadMe oficial)
      - table3.dat   # Fornax  (3150)
      - table4.dat   # Sculptor (1818)
      - table5.dat   # Sextans (1487)
      - ReadMe
    citation: "Walker, Mateo & Olszewski 2009 (AJ 137, 3100)"
    checksum: pending
    state: DATA_UNAVAILABLE   # host denegado por el proxy (18-ago-2026)
    note: >
      datos ESTELARES individuales (RA/Dec, v_helio, error,
      probabilidad de pertenencia) — σ_los(R) se derivará con
      selección de miembros y binning PREINSCRITOS, no de bins de
      figura.

  desi_dr2_bao:
    role: background_cosmology
    source: github.com/CobayaSampler/bao_data   # enlazada por DESI como
    subdir: desi_bao_dr2                        # likelihood BAO pública oficial
    raw_dir: data/raw/desi_dr2
    citation: >
      DESI Collaboration 2025 (DR2 BAO, arXiv:2503.14738); datos de
      likelihood distribuidos en CobayaSampler/bao_data
    state: AVAILABLE          # ingerido de un clone git con commit fijado
    bins:                     # identificadores OFICIALES (z_eff)
      bgs: 0.295
      lrg-z0: 0.510           # ≡ "LRG1" en documentación informal
      lrg-z1: 0.706           # ≡ "LRG2"
      lrgpluselg: 0.934
      elg: 1.321
      qso: 1.484
      lya: 2.330

  desi_dr2_chains:
    role: background_cosmology_benchmark
    host: data.desi.lbl.gov
    path: public/papers/y3/bao-cosmo-params/
    state: DATA_UNAVAILABLE   # host denegado por el proxy (18-ago-2026)
    note: >
      cadenas/best-fits oficiales para el benchmark ΛCDM propio vs
      DESI oficial; el bundle Zenodo (~1.3 GB) solo para auditoría
      profunda posterior.

  pantheonplus:
    role: supernova_distances
    source: PantheonPlusSH0ES/DataRelease
    raw_dir: data/pantheon    # legacy: ya descargado y verificado
    state: AVAILABLE          # SHA256 fijados en download_data.py (31-jul-2026)
    citation: "Scolnic et al. 2022 (ApJ 938, 113); Brout et al. 2022"

  union3:
    role: supernova_distances
    source: rubind/union3_release
    raw_dir: data/raw/union3
    state: AVAILABLE          # ingerido @ f5c38734 (matriz μ 22 bins)
    note: >
      all_samples_union3_cosmo=2.npz (100 MB) NO commiteado por
      política de tamaño — se obtiene del clone en el commit fijado
      del manifest.

  union3_1:
    role: supernova_distances
    source: rubind/union3_release
    raw_dir: data/raw/union3_1
    state: AVAILABLE          # dataset SEPARADO de union3 (no mezclar)
    note: matrices μ UNITY1.7 y UNITY1.8 del mismo release

  des_dovekie:
    role: supernova_distances_and_mocks
    source: des-science/DES-SN5YR
    raw_dir: data/raw/des_dovekie
    state: AVAILABLE          # HD + covarianzas + script oficial @ c9a4fcaf
    note: >
      4_DISTANCES_COVMAT/ y 5_COSMOLOGY/ para datos; la validación del
      pipeline propio ANTES de tocar datos es el PR #15
      (results/2026-09-12_dovekie_mocks/) — observable calculable ≠
      observable validado. El HD tiene 1820 SNe (verificado por bytes:
      nsn de ambos npz y filas del HD tras el corte zHD > 0).

  des_dovekie_photmocks:
    role: upstream_pipeline_mocks
    source: des-science/DES-SN5YR
    subdir: 1_SIMULATIONS
    version: c9a4fcafc4cbd19bd750dee47fc76194a45c181f
    raw_dir: data/raw/des_dovekie_photmocks
    state: DATA_UNAVAILABLE   # no ingerido: fuera del repo y del alcance
    note: >
      los 25 mocks DES son fotometría SNANA cruda (HEAD/PHOT.FITS,
      ~20 MB; README sha256
      f9a0f2135a6c84ca65aee1320d8e47aba15c648aa981dc18a3576cf436d4ed25):
      validan las etapas DES aguas arriba (SALT3 + BBC) dentro del
      pipeline de DES; consumirlos aquí exigiría la pila SNANA/Pippin,
      que este repositorio no contiene. La validación por mocks del
      pipeline PROPIO opera a nivel HD (PR #15, preinscrita). Cosmología
      inyectada documentada: H0 = 70, Ω_m = 0.315, w0 = −1, wa = 0.

  des_dovekie_chains:
    role: supernova_official_chains_benchmark
    source: des-science/DES-SN5YR
    subdir: 5_COSMOLOGY/chains/flcdm
    raw_dir: data/raw/des_dovekie_chains
    state: AVAILABLE          # un solo fichero (1.9 MB) commiteado @ c9a4fcaf
    note: >
      cadena nautilus flat-ΛCDM DES-SN only (dovekie_lcdm_nautilus.txt):
      benchmark del brazo ΛCDM propio SN-only (Ω_m oficial ponderado por
      log_weight = 0.3306 ± 0.0154). Es REFERENCIA, no dato: no entra en
      ningún likelihood. Las demás combinaciones de sondas quedan en el
      clone @ commit fijado.

  bbn_abundances:
    role: bbn_G_contrast_inputs
    host: literatura (arXiv / revistas) — egreso denegado desde el entorno (14-sep-2026)
    raw_dir: data/raw/bbn_abundances
    citation: "EMPRESS XV (arXiv:2506.24050); Aver et al. 2021 (JCAP 03, 027); Cooke, Pettini & Steidel 2018 (ApJ 855, 102); Planck 2018 VI (A&A 641, A6); PDG 2023 (τ_n)"
    state: AVAILABLE          # 5 valores publicados TRANSCRITOS; bytes oficiales NO verificados (declarado en manifest y schema_report)
    note: >
      Entradas del Contraste de los Residuos vía BBN: Y_P (EMPRESS XV principal,
      Aver+2021 control), D/H (Cooke+2018), prior ω_b (Planck 2018) y τ_n (PDG).
      Son cinco números publicados transcritos a mano, no bytes de un release:
      la verificación de la transcripción contra las fuentes es tarea del autor
      (navegador) y queda declarada como pendiente en el manifest; el artefacto
      que los consuma debe llevar el mismo aviso.

  local_kz_bounds:
    role: local_vertical_dynamics_bounds
    host: literatura — egreso denegado desde el entorno (21-sep-2026)
    raw_dir: data/raw/local_kz_bounds
    citation: "Holmberg & Flynn 2000 (ρ_dyn(0)); McKee, Parravano & Hollenbach 2015 (ρ_bar(0), ρ_dyn(0), Σ_bar); Bovy & Tremaine 2012 (Σ(<1.1 kpc))"
    state: AVAILABLE          # 5 valores publicados TRANSCRITOS; bytes oficiales NO verificados (declarado en manifest y schema_report)
    note: >
      Densidad dinámica local en el plano, densidad bariónica local y Σ(<1.1 kpc)
      para acotar la amplitud A de la Ley de Cronos débil por su fuerza vertical
      (frente 5c, preinscripción «Oort–K_z»). Transcripción manual; la
      verificación contra las fuentes es tarea del autor y queda declarada como
      pendiente. El artefacto que la consuma propaga el aviso.

  ppn_bounds:
    role: ppn_preferred_frame_bounds
    host: literatura — egreso denegado desde el entorno (15-sep-2026)
    raw_dir: data/raw/ppn_bounds
    citation: "Müller, Williams & Turyshev 2008 (LLR, α₁); Shao & Wex 2012 (púlsares, α̂₁); Nordtvedt 1987 (giro solar, α₂); Shao et al. 2013 (púlsares, α̂₂)"
    state: AVAILABLE          # 4 cotas publicadas TRANSCRITAS; bytes oficiales NO verificados (declarado en manifest y schema_report)
    note: >
      Cotas PPN de marco preferido para acotar α_a del sector Atlas (E4_Atlas).
      Cuatro números publicados transcritos a mano desde la nota del autor y la
      literatura anotada; la verificación contra las fuentes es tarea del autor
      y queda declarada como pendiente. El artefacto que las consuma propaga el aviso.
