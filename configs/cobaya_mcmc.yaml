# Cobaya — pipeline de muestreo bayesiano para el MCMC
# Sección 14 del Tratado Unificado.
# Uso: cobaya-run configs/cobaya_mcmc.yaml

theory:
  classy:
    extra_args:
      output: tCl,pCl,lCl,mPk
      lensing: yes
      P_k_max_h/Mpc: 10.0
      non linear: halofit
      # Hooks MCMC: requieren CLASS modificado
      mcmc_eps:        0.012
      mcmc_z_trans:    8.9

likelihood:
  planck_2018_lowl.TT:
  planck_2018_lowl.EE:
  planck_2018_highl_plik.TTTEEE:
  planck_2018_lensing.clik:
  bao.sdss_dr12_consensus_bao:
  bao.sixdf_2011_bao:
  sn.pantheon:

params:
  H0:
    prior:
      min: 60.0
      max: 80.0
    ref:
      dist: norm
      loc:   69.8
      scale: 1.0
    proposal: 0.5
    latex: H_0
  omega_b:
    prior:
      min: 0.018
      max: 0.026
    ref:
      dist: norm
      loc:   0.02238
      scale: 0.0002
    latex: \Omega_b h^2
  omega_cdm:
    prior:
      min: 0.10
      max: 0.14
    ref:
      dist: norm
      loc:   0.1200
      scale: 0.001
    latex: \Omega_c h^2
  n_s:
    prior:
      min: 0.93
      max: 1.00
    ref:
      dist: norm
      loc:   0.965
      scale: 0.005
    latex: n_s
  ln_A_s_1e10:
    prior:
      min: 2.5
      max: 3.5
    ref:
      dist: norm
      loc:   3.044
      scale: 0.020
    latex: \ln(10^{10} A_s)
  tau_reio:
    prior:
      dist: norm
      loc:   0.0544
      scale: 0.0073
    proposal: 0.005
    latex: \tau_{\rm reio}

  # --- Parámetros específicos MCMC ---
  mcmc_eps:
    prior:
      min: -0.05
      max:  0.10
    ref:
      dist: norm
      loc:   0.012
      scale: 0.003
    proposal: 0.002
    latex: \varepsilon \equiv \delta_0
  mcmc_z_trans:
    prior:
      min: 1.0
      max: 20.0
    ref:
      dist: norm
      loc:   8.9
      scale: 0.5
    proposal: 0.3
    latex: z_{\rm trans}

sampler:
  mcmc:
    Rminus1_stop: 0.02
    max_tries: 1000
    burn_in:   0
    learn_proposal: True

output: chains/mcmc_planck_bao_sn
