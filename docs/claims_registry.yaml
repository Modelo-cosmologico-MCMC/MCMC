# Registro canónico de claims del programa MCMC — FUENTE ÚNICA.
#
# CONTRATO (rama infra/claims-registry, 12-sep-2026): este fichero es
# la única fuente de la trazabilidad; docs/matriz_trazabilidad.md y
# docs/ontology_nomology_observables.md se GENERAN desde aquí con
# scripts/make_traceability.py y el test de no-divergencia
# (tests/test_claims_registry.py) falla si lo commiteado difiere de lo
# regenerado. Un cambio de estatuto (p. ej. #13, #15, 5E) se hace AQUÍ
# y se regenera — dos documentos contradictorios dejan de ser posibles.
#
# Esquema por fila (schema mínimo del traspaso + `test`, necesario
# para regenerar la columna Test de la matriz):
#   claim_id, entity, law, derivation, implementation, test,
#   observable, dataset, falsifier, evidence_level, status, artifact
# «—» declara un hueco real, no lo esconde (contrato del Ap. H).
#
# `status` usa un vocabulario CONTROLADO con tres categorías negativas
# DISTINTAS (negativo ≠ no derivado ≠ no ejecutado):
#   interno               comprobación interna superada (E8) — nunca
#                         demostración física
#   condicional           depende de un frente abierto declarado
#   calibrado             entradas ajustadas, no derivación
#   preinscrito           protocolo congelado antes de datos/resultado
#   resultado-negativo    experimento EJECUTADO con desenlace contrario
#                         o nulo, publicado como tal
#   claim-no-derivado     afirmación aún sin derivación (no confundir
#                         con negativo: no se ha podido ni ejecutar el
#                         test que lo decidiría)
#   experimento-no-ejecutado  protocolo listo, datos ausentes (fallo
#                         cerrado); sin veredicto
#   hueco-declarado       pieza sin test dedicado, declarada
#
# FRB NO ENTRA: sin dataset concreto con versión/DOI persistente, sin
# observable consumido por el MCMC y sin relación precisa con el
# parámetro bariónico que restringiría, es literatura relevante, no
# evidencia del modelo (el control bariónico anclado hoy: kSZ
# 2604.19744/45). Añadir una fila FRB exigirá esos cuatro elementos.

schema_version: 1
status_vocabulary:
  - interno
  - condicional
  - calibrado
  - preinscrito
  - resultado-negativo
  - claim-no-derivado
  - experimento-no-ejecutado
  - hueco-declarado

